[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-plugin-websearch"
version = "0.1.0"
description = "arc plugin: web_search, read_url, http_request, extract_html — pluggable backends + extractors."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "migo" }]
keywords = ["arc", "agent", "plugin", "web-search", "web-fetch"]

# Runtime deps. arc itself is provided by the host process (we import from
# `arc.plugin_api`) so it's not declared here.
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",      # httpx mocking
  "ruff>=0.5",
]

[project.entry-points."arc.plugins"]
websearch = "arc_plugin_websearch.plugin:build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_plugin_websearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
